name: Python CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash

  lint-cruft:
    name: Check Project Template Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify no .rej conflict files exist
        run: test -z "$(find . -iname '*.rej')"

  pre-commit:
    name: Run Pre-Commit Hooks
    runs-on: ubuntu-latest
    needs: [ actionlint, lint-cruft ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      # Inject the official pre-compiled wheel directly into the runner's environment
      - name: Pre-install Linux wxPython Wheel
        run: pip install https://github.com/wxWidgets/Phoenix/releases/download/wxPython-4.3.2/wxpython-4.3.2+ubuntu2204-cp312-cp312-linux_x86_64.whl

      # Poetry will see wxpython is already installed in the environment and skip trying to build it from PyPI
      - name: Install Project Dependencies
        run: poetry install

      - name: Install and Run Pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python Environment
        uses: ./.github/actions/python-poetry-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest